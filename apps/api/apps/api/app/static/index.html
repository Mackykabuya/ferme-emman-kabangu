<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="stylesheet" href="marque.css"><script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferme Emman Kabangu · Tableau de bord</title>
<style>
:root{--fond:#eef2ec;--carte:#fff;--encre:#17301f;--doux:#5d6f62;--ligne:#d5ddd3;--eau:#1d6fa5;--ok:#2e7d4f;--alerte:#b7791f;--danger:#b3382c}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--encre);color:#eef6ea;padding:18px 24px}
header h1{margin:0;font-size:1.35rem}header p{margin:2px 0 0;color:#a9c4b0;font-size:.95rem}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:20px 24px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:14px}}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:18px}
h2{font-size:1.1rem;margin:0 0 12px}h3{font-size:1rem;margin:16px 0 6px}
label{display:block;font-size:.88rem;color:var(--doux);margin-top:10px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--ligne);border-radius:6px;font:inherit;background:#fff;color:var(--encre)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;border-top:1px solid var(--ligne);margin:16px 0 0;padding:6px 0 0}legend{font-weight:600;padding:0 6px 0 0}
.cas{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--ligne);background:#fff;color:var(--encre);padding:6px 10px}
button:hover{border-color:var(--eau)}
button.principal{width:100%;margin-top:16px;padding:11px;background:var(--eau);border-color:var(--eau);color:#fff;font-weight:600}
:focus-visible{outline:3px solid #7fb6dc;outline-offset:2px}
.resume{background:var(--encre);color:#eef6ea;border-radius:10px;padding:16px 18px;margin-bottom:16px}
.vide{color:var(--doux);text-align:center;padding:40px 10px}
.erreur{background:#fbeceb;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:12px}
.etat{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font-weight:600;font-size:.92rem}
.vanne{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.vanne .pastille{font-size:1.25rem;font-weight:700;padding:8px 16px;border-radius:8px;color:#fff}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.chiffres div{background:var(--fond);border-radius:8px;padding:10px}
.chiffres b{display:block;font-size:1.3rem}.chiffres span{font-size:.85rem;color:var(--doux)}
.jauge{position:relative;height:16px;background:var(--fond);border-radius:8px;margin:26px 0 22px;border:1px solid var(--ligne)}
.jauge .ideal{position:absolute;top:0;bottom:0;background:#bfe0c9;border-radius:8px}
.jauge .seuil{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--encre)}
.jauge .sol{position:absolute;top:-6px;width:12px;height:26px;margin-left:-6px;border-radius:6px;background:var(--eau);border:2px solid #fff}
.jauge small{position:absolute;top:22px;font-size:.78rem;color:var(--doux);white-space:nowrap;transform:translateX(-50%)}
ul,ol{margin:4px 0;padding-left:22px}li{margin:4px 0}
.note{font-size:.85rem;color:var(--doux);margin-top:10px}
.avert{background:#fff6e0;border:1px solid #ecd28f;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.92rem}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"><link rel="stylesheet" href="tableau.css"><script src="tableau.js"></script></head>
<body class="page-analyse">
<header><h1><img class="logo" src="logo.svg" alt="">Ferme Emman Kabangu</h1><p><a href="parcelles.html" style="color:#bfe0c9">Retour aux parcelles</a></p><p>Que dit le sol, et faut-il arroser ? Entrez les mesures d'une parcelle pour le savoir.</p></header>
<main>
<section class="carte" aria-label="Mesures de la parcelle">
  <h2>Parcelle à analyser</h2>
  <label for="plante">Culture</label><select id="plante"></select>
  <div class="duo">
    <div><label for="stade">Stade</label><select id="stade"><option>Germination</option><option>Croissance végétative</option><option selected>Floraison</option><option>Fructification/Maturation</option></select></div>
    <div><label for="type_sol">Type de sol</label><select id="type_sol"><option>Sableux</option><option selected>Limoneux</option><option>Argileux</option></select></div>
  </div>
  <label for="surface_parcelle_m2">Surface de la parcelle (m²)</label><input id="surface_parcelle_m2" type="number" value="1000" min="1">
  <fieldset><legend>Remplir avec un exemple</legend>
    <div class="cas" id="cas"></div></fieldset>
  <fieldset><legend>Le sol</legend><div class="duo">
    <div><label for="humidite_sol_pct">Humidité (%)</label><input id="humidite_sol_pct" type="number" step="0.1"></div>
    <div><label for="temperature_sol_c">Température (°C)</label><input id="temperature_sol_c" type="number" step="0.1"></div>
    <div><label for="ph">Acidité (pH)</label><input id="ph" type="number" step="0.1"></div>
    <div><label for="conductivite_ec_dsm">Sel (dS/m)</label><input id="conductivite_ec_dsm" type="number" step="0.1"></div>
    <div><label for="azote_N_mgkg">Azote N (mg/kg)</label><input id="azote_N_mgkg" type="number" step="1"></div>
    <div><label for="phosphore_P_mgkg">Phosphore P (mg/kg)</label><input id="phosphore_P_mgkg" type="number" step="1"></div>
    <div><label for="potassium_K_mgkg">Potassium K (mg/kg)</label><input id="potassium_K_mgkg" type="number" step="1"></div>
  </div></fieldset>
  <fieldset><legend>L'air et la météo</legend><div class="duo">
    <div><label for="temperature_air_c">Température (°C)</label><input id="temperature_air_c" type="number" step="0.1"></div>
    <div><label for="humidite_air_pct">Humidité (%)</label><input id="humidite_air_pct" type="number" step="1"></div>
    <div><label for="prevision_pluie_6h_mm">Pluie prévue 6 h (mm)</label><input id="prevision_pluie_6h_mm" type="number" step="0.1"></div>
  </div></fieldset>
  <button class="principal" id="go">Analyser la parcelle</button>
</section>
<section id="resultat" aria-live="polite"><div class="carte vide">Choisissez un exemple ou entrez vos mesures, puis lancez l'analyse.</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const CHAMPS = ["humidite_sol_pct","temperature_sol_c","ph","conductivite_ec_dsm","azote_N_mgkg","phosphore_P_mgkg","potassium_K_mgkg","temperature_air_c","humidite_air_pct","prevision_pluie_6h_mm"];
const COULEUR = {"Saine":"--ok","Carence en N":"--alerte","Carence en P":"--alerte","Carence en K":"--alerte","Stress thermique":"--danger","Attaque Fongique/Parasitaire":"--danger"};
let plantes = [];
const mid = (p, a, b) => (p[a] + p[b]) / 2;
const plante = () => plantes.find(p => p.id == $("plante").value);

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function liste(tag, items) { const l = el(tag); items.forEach(t => l.appendChild(el("li", "", t))); return l; }
function fmt(n) { return Math.round(n).toLocaleString("fr-FR"); }

const CAS = {
  "Sol équilibré": p => ({}),
  "Manque d'azote": p => ({azote_N_mgkg: Math.round(mid(p,"n_min","n_max") * 0.35)}),
  "Sol trop chaud": p => ({temperature_sol_c: 40, temperature_air_c: 38, humidite_air_pct: 40}),
  "Sol détrempé": p => ({humidite_sol_pct: p.humidite_sol_max + 12}),
  "Pluie annoncée": p => ({prevision_pluie_6h_mm: 9}),
  "Trop de sel": p => ({conductivite_ec_dsm: +(p.ec_max_dsm * 2.2).toFixed(1)})
};
function remplir(nom) {
  const p = plante(), base = {
    humidite_sol_pct: Math.round(mid(p,"humidite_sol_min","humidite_sol_max") - 10), temperature_sol_c: 26,
    ph: +mid(p,"ph_min","ph_max").toFixed(1), conductivite_ec_dsm: +(p.ec_max_dsm * 0.5).toFixed(1),
    azote_N_mgkg: Math.round(mid(p,"n_min","n_max")), phosphore_P_mgkg: Math.round(mid(p,"p_min","p_max")),
    potassium_K_mgkg: Math.round(mid(p,"k_min","k_max")), temperature_air_c: 30, humidite_air_pct: 55, prevision_pluie_6h_mm: 0};
  Object.entries({...base, ...CAS[nom](p)}).forEach(([k, v]) => $(k).value = v);
  analyser();
}

async function analyser() {
  const corps = {plant_id: +$("plante").value, stade: $("stade").value, type_sol: $("type_sol").value,
                 surface_parcelle_m2: +$("surface_parcelle_m2").value};
  CHAMPS.forEach(c => corps[c] = parseFloat($(c).value));
  const zone = $("resultat"); zone.replaceChildren();
  if (CHAMPS.some(c => Number.isNaN(corps[c]))) { zone.appendChild(el("div", "erreur", "Il manque des mesures : remplissez tous les champs ou choisissez un exemple.")); return; }
  try {
    const r = await fetch("/decision/parcelle", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps)});
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Une valeur est hors des limites acceptées. Vérifiez les mesures saisies.");
    afficher(d, corps);
  } catch (e) {
    zone.appendChild(el("div", "erreur", e instanceof TypeError ? "Le serveur ne répond pas. Vérifiez qu'il est lancé (uvicorn app.main:app) puis réessayez." : e.message));
  }
}

function afficher(d, corps) {
  const zone = $("resultat"), g = d.etape_1_diagnostic, irr = d.etape_2_irrigation, p = plante();
  const bandeau = el("div", "resume"); bandeau.appendChild(el("b", "", "En résumé : ")); bandeau.appendChild(document.createTextNode(d.resume_agriculteur));
  zone.appendChild(bandeau);

  const c1 = el("div", "carte"); c1.appendChild(el("h2", "", "Étape 1 · Le sol"));
  const badge = el("span", "etat", g.etat_sante_libelle); badge.style.background = `var(${COULEUR[g.etat_sante]})`;
  c1.appendChild(badge); c1.appendChild(el("p", "", g.message_simple));
  c1.appendChild(el("h3", "", "Que faire")); c1.appendChild(liste("ol", g.actions));
  if (g.a_surveiller.length) { c1.appendChild(el("h3", "", "À surveiller")); c1.appendChild(liste("ul", g.a_surveiller)); }
  if (g.avertissement) c1.appendChild(el("div", "avert", g.avertissement));
  if (g.confiance !== null) c1.appendChild(el("p", "note", `Certitude du système : ${Math.round(g.confiance * 100)} %`));
  zone.appendChild(c1);

  const c2 = el("div", "carte"); c2.style.marginTop = "16px"; c2.appendChild(el("h2", "", "Étape 2 · L'arrosage"));
  const v = el("div", "vanne"), pas = el("span", "pastille", irr.vanne_ouverte ? "Vanne ouverte" : "Vanne fermée");
  pas.style.background = irr.vanne_ouverte ? "var(--eau)" : "var(--doux)"; v.appendChild(pas); v.appendChild(el("span", "", irr.motif)); c2.appendChild(v);

  const j = el("div", "jauge"), lo = p.humidite_sol_min, hi = p.humidite_sol_max;
  const ideal = el("div", "ideal"); ideal.style.left = lo + "%"; ideal.style.width = (hi - lo) + "%"; j.appendChild(ideal);
  const seuil = el("div", "seuil"); seuil.style.left = (lo + hi) / 2 + "%"; j.appendChild(seuil);
  const sol = el("div", "sol"); sol.style.left = Math.min(100, corps.humidite_sol_pct) + "%"; j.appendChild(sol);
  [[(lo + hi) / 2, "on arrose sous ce trait"], [corps.humidite_sol_pct, `sol : ${corps.humidite_sol_pct} %`]].forEach(([x, t], i) => {
    const s = el("small", "", t); s.style.left = Math.min(92, Math.max(8, x)) + "%"; if (i) s.style.top = "-24px"; j.appendChild(s); });
  c2.appendChild(el("p", "note", `Zone verte : humidité idéale pour ${p.nom} (${lo} à ${hi} %).`)); c2.appendChild(j);

  if (irr.vanne_ouverte) {
    const ch = el("div", "chiffres");
    [[fmt(irr.besoin_L_parcelle_jour) + " L", "au total pour la parcelle"], [irr.besoin_L_par_plant_jour.toFixed(1).replace(".", ",") + " L", "par plant"], [irr.duree_min + " min", "de goutte-à-goutte"]]
      .forEach(([a, b]) => { const x = el("div"); x.appendChild(el("b", "", a)); x.appendChild(el("span", "", b)); ch.appendChild(x); });
    c2.appendChild(ch); c2.appendChild(el("p", "", irr.conseil_horaire));
    if (irr.ajustement) c2.appendChild(el("p", "", irr.ajustement));
  }
  c2.appendChild(el("p", "note", `Calcul par ${irr.methode === "ml" ? "modèle d'apprentissage" : "formule agronomique"}${irr.methode.includes("garde") ? " (le modèle s'écartait trop, la formule a été gardée)" : ""}.`));
  zone.appendChild(c2);
}

(async () => {
  try {
    plantes = await (await fetch("/plants")).json();
    plantes.forEach(p => { const o = el("option", "", p.nom); o.value = p.id; $("plante").appendChild(o); });
    Object.keys(CAS).forEach(nom => { const b = el("button", "", nom); b.type = "button"; b.onclick = () => remplir(nom); $("cas").appendChild(b); });
    $("go").onclick = analyser;
  } catch (e) { $("resultat").replaceChildren(el("div", "erreur", "Impossible de charger les cultures : le serveur ne répond pas.")); }
})();
</script>
</body>
</html>
